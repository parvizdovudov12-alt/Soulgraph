<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe Human Hologram</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 10;
        color: #8fe6ff;
        background: rgba(0, 20, 30, 0.3);
        border: 1px solid rgba(0, 170, 255, 0.25);
        border-radius: 12px;
        padding: 12px 14px;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 24px rgba(0, 170, 255, 0.18);
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hud p {
        margin: 0;
        font-size: 12px;
        color: rgba(180, 235, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>Human Hologram</h1>
      <p>ЛКМ: вращение, колесо: масштаб, авто-поворот включен</p>
    </div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 1.6, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = false;
      controls.target.set(0, 1.3, 0);

      const ambientLight = new THREE.AmbientLight(0x66ccff, 0.45);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x33bbff, 1.3, 20);
      pointLight.position.set(3, 5, 6);
      scene.add(pointLight);

      const material = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        wireframe: true,
      });

      const hologram = new THREE.Group();
      scene.add(hologram);

      function createPart(geometry, x, y, z, rx = 0, ry = 0, rz = 0, scale = [1, 1, 1]) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.rotation.set(rx, ry, rz);
        mesh.scale.set(scale[0], scale[1], scale[2]);
        hologram.add(mesh);
        return mesh;
      }

      createPart(new THREE.SphereGeometry(0.48, 18, 18), 0, 3.15, 0, 0, 0, 0, [0.95, 1.15, 0.95]);
      createPart(new THREE.CylinderGeometry(0.16, 0.2, 0.36, 14), 0, 2.55, 0);
      createPart(new THREE.CylinderGeometry(0.85, 1.05, 1.9, 18, 10), 0, 1.25, 0, 0, 0, 0, [1, 1, 0.7]);
      createPart(new THREE.CylinderGeometry(0.55, 0.7, 1.05, 16, 10), 0, 0.2, 0, 0, 0, 0, [1, 1, 0.7]);

      createPart(new THREE.SphereGeometry(0.22, 12, 12), -0.95, 2.25, 0);
      createPart(new THREE.SphereGeometry(0.22, 12, 12), 0.95, 2.25, 0);

      createPart(new THREE.CylinderGeometry(0.16, 0.2, 1.35, 14, 10), -1.28, 1.45, 0, 0, 0, -0.28);
      createPart(new THREE.CylinderGeometry(0.16, 0.2, 1.35, 14, 10), 1.28, 1.45, 0, 0, 0, 0.28);

      createPart(new THREE.SphereGeometry(0.18, 12, 12), -1.6, 0.85, 0);
      createPart(new THREE.SphereGeometry(0.18, 12, 12), 1.6, 0.85, 0);

      createPart(new THREE.CylinderGeometry(0.14, 0.16, 1.1, 14, 10), -1.72, 0.02, 0, 0, 0, -0.12);
      createPart(new THREE.CylinderGeometry(0.14, 0.16, 1.1, 14, 10), 1.72, 0.02, 0, 0, 0, 0.12);

      createPart(new THREE.SphereGeometry(0.14, 10, 10), -1.82, -0.58, 0.02);
      createPart(new THREE.SphereGeometry(0.14, 10, 10), 1.82, -0.58, 0.02);

      createPart(new THREE.CylinderGeometry(0.28, 0.38, 1.75, 16, 10), -0.38, -1.25, 0, 0, 0, 0.06);
      createPart(new THREE.CylinderGeometry(0.28, 0.38, 1.75, 16, 10), 0.38, -1.25, 0, 0, 0, -0.06);

      createPart(new THREE.SphereGeometry(0.2, 12, 12), -0.38, -2.2, 0);
      createPart(new THREE.SphereGeometry(0.2, 12, 12), 0.38, -2.2, 0);

      createPart(new THREE.CylinderGeometry(0.22, 0.26, 1.7, 16, 10), -0.38, -3.45, 0);
      createPart(new THREE.CylinderGeometry(0.22, 0.26, 1.7, 16, 10), 0.38, -3.45, 0);

      createPart(new THREE.BoxGeometry(0.42, 0.14, 0.9), -0.38, -4.35, 0.12, 0.18, 0, 0);
      createPart(new THREE.BoxGeometry(0.42, 0.14, 0.9), 0.38, -4.35, 0.12, 0.18, 0, 0);

      const ringGeometry = new THREE.RingGeometry(1.2, 1.35, 64);
      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        wireframe: true,
        side: THREE.DoubleSide,
      });
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = -4.5;
      scene.add(ring);

      hologram.position.y = 0.2;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        hologram.rotation.y += delta * 0.28;
        ring.rotation.z += delta * 0.18;
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
